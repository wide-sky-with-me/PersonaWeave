name: 问题报告
description: 提交可复现的程序、部署或文档问题。
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: |
        先搜索已有问题。请使用仓库夹具或合成输入，不上传 `.env`、密钥、个人照片、完整数据库或上游原始响应。
        涉及数据暴露或漏洞时使用 https://github.com/wide-sky-with-me/PersonaWeave/security/advisories/new 。
  - type: input
    id: version
    attributes:
      label: 程序版本
      description: 源码 commit、Windows 包版本或镜像标签；不要仅填写“最新版”。
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: 安装方式
      options:
        - Linux 源码开发
        - 默认 CUDA Docker
        - CPU Docker / ARM64 / Colima
        - Windows CPU 便携版
        - Windows GPU 便携版
        - 其他（在环境描述中说明）
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、CPU/GPU、Python/Node/pnpm 或容器版本及模型 Provider；请移除私人路径和地址。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现步骤
      description: 输入条件、具体操作、接口或脱敏命令；优先使用 tests/fixtures 中的图片。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与证据
      description: 公开状态码、脱敏日志、可公开截图；测试通过或图像像素变化不代表画质通过。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交检查
      options:
        - label: 已搜索现有 issue，并移除密钥、个人照片、私人地址和原始业务数据。
          required: true
