name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true
      - run: uv sync --dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - name: Cache verified local inference models
        uses: actions/cache@v4
        with:
          path: models
          key: ${{ runner.os }}-onnx-models-${{ hashFiles('scripts/download_models.py') }}
      - name: Prepare and verify inference models
        run: uv run python scripts/download_models.py
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
