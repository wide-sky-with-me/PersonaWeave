# Native LiteLLM Router deployments. Change environment values, not business aliases,
# to switch services; use the provider prefix required by LiteLLM in each model ID.
model_list:
  - model_name: personaweave-vision-default
    litellm_params:
      model: os.environ/AI_VISION_MODEL
      api_base: os.environ/AI_VISION_API_BASE
      api_key: os.environ/AI_VISION_API_KEY
  - model_name: personaweave-refine-default
    litellm_params:
      model: os.environ/AI_IMAGE_MODEL
      api_base: os.environ/AI_IMAGE_API_BASE
      api_key: os.environ/AI_IMAGE_API_KEY
      timeout: 600
      max_retries: 0

vision_roles:
  default: personaweave-vision-default
  identity_arbitration: personaweave-vision-default
  refinement: personaweave-vision-default

# Application-only metadata; credentials and provider parameters live exclusively above.
image_models:
  - model_name: personaweave-refine-default
    display_name: 默认图像编辑模型
    description: 使用所配置服务的图像编辑能力；生成候选须经人工检查后接受。
    generation:
      size: auto

default_image_alias: personaweave-refine-default

# Paid generation is not automatically retried or switched to another model by default.
router_settings:
  num_retries: 0
  timeout: 300
  routing_strategy: simple-shuffle
  fallbacks: []
